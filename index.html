<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Harika & Prem</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Italianno&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/cover.css">
    <link rel="stylesheet" href="css/opening.css">
    <link rel="stylesheet" href="css/hero.css">
    <link rel="stylesheet" href="css/couple.css">
    <link rel="stylesheet" href="css/date.css">
    <link rel="stylesheet" href="css/bridge.css">
</head>


<body class="intro-active cover-active">

    <!-- COVER: one tap starts the video and the song together -->
    <section id="cover" class="cover" aria-label="Wedding invitation cover">
        <p class="cover-eyebrow">To our dearest guests</p>
        <button id="coverGate" class="cover-gate" type="button" aria-label="Tap the doors to open the gates">
            <img src="assets/temple_gopuram.png" alt="" decoding="async" fetchpriority="high">
        </button>
        <p id="coverHint" class="cover-hint">Tap the doors to open the gates</p>
    </section>

    <!-- OPENING VIDEO -->

    <section id="opening" class="opening">

        <video
            id="introVideo"
            class="intro-video"
            muted
            playsinline
            webkit-playsinline
            preload="auto"
        >
            <source
                src="assets/opening.mp4"
                type="video/mp4"
            >
        </video>

        <button
            id="skipIntro"
            class="skip-intro"
            type="button"
        >
            Skip Intro →
        </button>

    </section>


    <!-- WEBSITE -->

    <main id="website">

        <div id="hero-container"></div>

        <div id="couple-container"></div>

        <div id="date-container"></div>

    </main>

      <iframe id="cardFrame" class="card-frame" title="Wedding invitation"
          data-src="card/index.html" aria-hidden="true"></iframe>


    <!-- JAVASCRIPT -->

    <script src="js/cover.js"></script>
    <script src="js/opening.js"></script>
    <script src="js/hero.js"></script>
    <script src="js/date.js"></script>
    <script src="js/main.js"></script>
    <script src="js/bridge.js"></script>
    <script src="js/music.js"></script>

</body>

</html>
