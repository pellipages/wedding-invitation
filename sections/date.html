<section
    class="date-section"
    id="date-section"
>


    <!-- DECORATIONS -->

    <img
        src="assets/kolam-red.png"
        class="date-kolam kolam-top-right"
        alt=""
    >


    <img
        src="assets/kolam-red.png"
        class="date-kolam kolam-left"
        alt=""
    >


    <img
        src="assets/tree-left.png"
        class="date-tree"
        alt=""
    >


    <img
        src="assets/lotus-left.png"
        class="date-lotus lotus-left"
        alt=""
    >


    <img
        src="assets/lotus-right.png"
        class="date-lotus lotus-right"
        alt=""
    >



    <!-- FALLING PETALS -->

    <div
        class="petal-container"
        id="petalContainer"
    >

        <span>🌸</span>
        <span>🌸</span>
        <span>🌸</span>
        <span>🌸</span>
        <span>🌸</span>
        <span>🌸</span>
        <span>🌸</span>

    </div>



    <!-- DATE CONTENT -->

    <div class="date-content">


        <h2 class="save-date-title">
            Save the Date
        </h2>


        <p class="scratch-subtitle">
            SCRATCH TO REVEAL
        </p>



        <!-- SCRATCH CARD -->

        <div
            class="scratch-card"
            id="scratchCard"
        >


            <!-- DATE UNDER CANVAS -->

            <div class="revealed-date">


                <p class="muhurtham-small">
                    Wedding Muhurtham
                </p>


                <div class="wedding-day">
                    18
                </div>


                <div class="wedding-month">
                    November
                </div>


                <div class="wedding-year">
                    2026
                </div>


                <div class="gold-line"></div>


                <div class="wedding-time">
                    6:01 PM
                </div>


                <p class="muhurtham-label">
                    MUHURTHAM
                </p>


            </div>



            <canvas
                id="scratchCanvas"
            ></canvas>


        </div>



        <!-- SHOW ONLY AFTER SCRATCH -->

        <div
            class="after-scratch"
            id="afterScratch"
        >


            <div class="date-symbol">
                ❦
            </div>


            <h3>
                Our forever begins here
            </h3>


            <div class="countdown">


                <div class="countdown-box">

                    <span id="days">
                        00
                    </span>

                    <small>
                        DAYS
                    </small>

                </div>


                <div class="countdown-box">

                    <span id="hours">
                        00
                    </span>

                    <small>
                        HOURS
                    </small>

                </div>


                <div class="countdown-box">

                    <span id="minutes">
                        00
                    </span>

                    <small>
                        MINUTES
                    </small>

                </div>


                <div class="countdown-box">

                    <span id="seconds">
                        00
                    </span>

                    <small>
                        SECONDS
                    </small>

                </div>


            </div>

        </div>


    </div>

</section>
